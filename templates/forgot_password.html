{% extends "base.html" %}

{% block title %}Forgot Password - SafePlate{% endblock %}

{% block content %}

<div class="auth-container">
    <div style="text-align: center; margin-bottom: 16px;">
        <img src="{{ url_for('static', filename='Logo.png') }}" alt="SafePlate Logo"
            style="max-height: 50px; width: auto;">
    </div>
    <div style="text-align: left; margin-top: 20px; padding-top: 15px; border-top: 1px solid #f0f0f0;">
        <a href="{{ url_for('login') }}"
            style="color: #718096; text-decoration: none; font-size: 0.9rem; font-weight: 500;">
            ⬅ Back to Login
        </a>
    </div>
    <h2 class="auth-title">Reset Password</h2>
    <p class="auth-desc">Enter your email to receive a code/link to reset your password.</p>

    <form action="{{ url_for('forgot_password') }}" method="POST">
        <div class="form-group">
            <label for="email" class="form-label">Email:</label>

            <input type="email" id="email" name="email" required
                style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
        </div>

        <button type="submit" class="auth-btn">Send Request</button>
    </form>
</div>
{% endblock %}
