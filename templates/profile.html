<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - SafePlate</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9f5;
            margin: 0;
            padding: 40px 20px;
        }

        .profile-container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #315c3b;
            text-align: center;
        }

        h2 {
            color: #315c3b;
            margin-top: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        p {
            text-align: center;
            color: #666;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .restriction {
            padding: 12px;
            margin: 8px 0;
            background: #f3f6f1;
            border-radius: 8px;
        }

        .restriction label {
            cursor: pointer;
        }

        input[type="checkbox"] {
            margin-right: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #315c3b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #24462c;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #315c3b;
        }
    </style>
</head>

<body>

<div class="profile-container">

    <h1>My Profile</h1>

    <p>Manage your personal information and dietary preferences.</p>

    <form method="POST" action="{{ url_for('profile') }}">

        <h2>Personal Information</h2>

        <div class="form-group">
            <label for="first_name">First Name</label>
            <input
                type="text"
                id="first_name"
                name="first_name"
                value="{{ first_name | default('', true) }}"
            >
        </div>

        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input
                type="text"
                id="last_name"
                name="last_name"
                value="{{ last_name | default('', true) }}"
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                value="{{ email | default('', true) }}"
                readonly
            >
        </div>

        <h2>Dietary Information</h2>

        <p>Select your dietary restrictions and preferences.</p>

        {% for restriction in restrictions_list %}

        <div class="restriction">
            <label>
                <input
                    type="checkbox"
                    name="restrictions"
                    value="{{ restriction }}"
                    {% if restriction in selected_restrictions %}checked{% endif %}
                >
                {{ restriction }}
            </label>
        </div>

        {% endfor %}

        <div class="form-group">
            <label for="ingredients_to_avoid">Ingredients to Avoid</label>
            <textarea
                id="ingredients_to_avoid"
                name="ingredients_to_avoid"
                rows="3"
                placeholder="Example: Peanuts, sesame, artificial sweeteners"
            >{{ ingredients_to_avoid | default('', true) }}</textarea>
        </div>

        <div class="form-group">
            <label for="dietary_notes">Additional Dietary Notes</label>
            <textarea
                id="dietary_notes"
                name="dietary_notes"
                rows="3"
                placeholder="Enter any additional dietary information"
            >{{ dietary_notes | default('', true) }}</textarea>
        </div>

        <button type="submit">Save Changes</button>

    </form>

    <a href="{{ url_for('home') }}" class="back-link">
        Back to Home
    </a>

</div>

</body>
</html>
