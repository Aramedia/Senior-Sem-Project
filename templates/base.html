<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SafePlate{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>

<body>

    <!-- NAVBAR for all website -->
    <header class="navbar">
        <div class="logo">
            <a href="/" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px;">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="SafePlate Logo"
                    style="height: 36px; width: auto; object-fit: contain;">
                <span class="logo-text" style="font-weight: 700; font-size: 20px; letter-spacing: -0.5px;">Safe<span
                        style="color: #E85A2A;">Plate</span></span>
            </a>
        </div>
        <nav class="nav-links">
            <a href="/#how-it-works">How it Works</a>
            <a href="/#recipes">Recipes & Brands</a>
            <a href="/#restaurants">Restaurant Finder</a>
            <a href="/#safety">Our Safety Standard</a>
            <a href="/#faq">FAQ</a>
        </nav>
        <div class="auth-buttons">
            {% if current_user.is_authenticated %}
            <span>Hello, {{ current_user.email }}</span>

            <a href-"{{ url_for('profile') }}" class="btn-primary-small"> My Profile</a>
            <a href="/logout" class="btn-primary-small">Logout</a>
            {% else %}
            <a href="/login" class="btn-primary-small">Sign In</a>
            <a href="/register" class="btn-primary-small">Create Profile</a>
            {% endif %}
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>

</html>
